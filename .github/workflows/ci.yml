
name: SecureShip CI

on:
  push:
    branches:
      - main
      - feature/modern-ui-15october
  pull_request:
    branches:
      - main
      
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Pytest
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Type-check and build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [test, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t secureship:ci .

      - name: Smoke test the container
        run: |
          docker run -d --name secureship-ci -p 8000:8000 secureship:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/app/ | grep -q 'id="root"'
          curl -fsS -X POST http://127.0.0.1:8000/shipments \
            -H 'Content-Type: application/json' \
            -d '{"recipient":"CI","destination":"Rabat"}'
          curl -fsS http://127.0.0.1:8000/stats

      - name: Show container logs on failure
        if: failure()
        run: docker logs secureship-ci
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: python -m pip install semgrep==1.180.0

      - name: Scan backend and frontend
        run: semgrep scan --config auto app/ frontend/src/
