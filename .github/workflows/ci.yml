
name: SecureShip CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Pytest
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Type-check and build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [test, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t secureship:ci .

      - name: Smoke test authentication and shipments
        run: |
          # Generate throwaway CI-only credentials, never real user secrets.
          printf 'SECURESHIP_AUTH_USER=ci-operator\n' > /tmp/secureship-ci.env
          printf 'SECURESHIP_AUTH_PASSWORD_HASH=' >> /tmp/secureship-ci.env
          docker run --rm --entrypoint python secureship:ci -c \
            'from app.auth import hash_password; print(hash_password("ci-test-password-long"))' \
            >> /tmp/secureship-ci.env
          docker run -d --name secureship-ci -p 127.0.0.1:8000:8000 \
            --env-file /tmp/secureship-ci.env secureship:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/app/ | grep -q 'id="root"'
          # Anonymous users may not access shipments.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/shipments)" = 401
          curl -fsS -c /tmp/secureship-ci-cookies -X POST \
            http://127.0.0.1:8000/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-operator","password":"ci-test-password-long"}' \
            > /tmp/secureship-ci-login.json
          csrf=$(python -c 'import json; print(json.load(open("/tmp/secureship-ci-login.json"))["csrf_token"])')
          curl -fsS -b /tmp/secureship-ci-cookies -X POST \
            http://127.0.0.1:8000/shipments \
            -H 'Content-Type: application/json' \
            -H "X-CSRF-Token: $csrf" \
            -d '{"recipient":"CI","destination":"Rabat"}'
          curl -fsS -b /tmp/secureship-ci-cookies http://127.0.0.1:8000/stats
          rm -f /tmp/secureship-ci.env /tmp/secureship-ci-cookies /tmp/secureship-ci-login.json

      # Complete vulnerability report for audit and investigation
      - name: Trivy - Generate vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: secureship:ci
          scanners: vuln
          format: json
          output: trivy-report.json
          exit-code: '0'
          version: v0.76.0

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: secureship-trivy-report
          path: trivy-report.json
          retention-days: 14

      # Fail CI when fixable HIGH or CRITICAL vulnerabilities are found
      - name: Trivy - Security gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: secureship:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true


      - name: Show container logs on failure
        if: failure()
        run: docker logs secureship-ci
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: python -m pip install semgrep==1.180.0

      - name: Scan backend and frontend
        run: semgrep scan --config auto --error app/ frontend/src/
  gitleaks:
    name: Gitleaks Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for exposed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
  sca:
    name: Software Composition Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit frontend production dependencies
        run: npm --prefix frontend audit --omit=dev
  checkov:
    name: Checkov Configuration Security
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: python -m pip install checkov==3.3.20

      - name: Scan Dockerfile
        run: checkov -f Dockerfile --framework dockerfile

      - name: Scan GitHub Actions workflows
        run: checkov -d .github/workflows --framework github_actions