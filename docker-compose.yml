# Whole application on a single port: http://127.0.0.1:8000/app
#   docker compose up --build
services:
  secureship:
    build: .
    image: secureship:dev
    ports:
      - "127.0.0.1:8000:8000"   # local security lab only
    env_file:
      - .env   # generated by scripts/setup_auth.py; NEVER commit
    volumes:
      - secureship-data:/app/data

volumes:
  secureship-data:
